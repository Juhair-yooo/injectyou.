          <div class="hero-copy"><p class="eyebrow"><span class="tiny-line"></span> FOR THE WORK YOU COULD DO</p><h1>Your potential.<br>Put <em>to work.</em></h1><p class="hero-description">You don’t need a perfect résumé to make a start. Find meaningful projects, build with guidance, and turn your curiosity into experience.</p><div class="hero-actions"><a class="button button-primary" href="#/join/intern">Explore your next step <span aria-hidden="true">↗</span></a><a class="button button-outline" href="#/join/company">I have a project <span aria-hidden="true">↗</span></a></div><div class="hero-reassurance"><span><b aria-hidden="true">✓</b> No experience needed</span><span><b aria-hidden="true">✓</b> Guidance at every step</span></div></div>

        <section class="how-section section-space wrap" id="how-it-works"><div class="section-heading"><div><p class="eyebrow">LESS GUESSWORK. MORE MOMENTUM.</p><h2>A clear path from<br><em>“what if”</em> to “I did.”</h2></div><p>Start with an interest. Leave with something you made—and experience you can show.</p></div><div class="steps-grid"><article class="step-card"><div class="step-top"><span>01</span><span class="step-symbol">↗</span></div><h3>Find your kind of work.</h3><p>Choose the fields you’re curious about. Explore briefs that match your interests, with clear deliverables and your fee upfront.</p><span class="step-note">Curiosity is your starting point</span></article><article class="step-card"><div class="step-top"><span>02</span><span class="step-symbol">⌘</span></div><h3>Make it happen, together.</h3><p>Apply for a project. Once assigned, get a clear brief and feedback from your inJectyou coordinator as you bring it to life.</p><span class="step-note">A human in your corner</span></article><article class="step-card"><div class="step-top"><span>03</span><span class="step-symbol">✧</span></div><h3>Carry your progress forward.</h3><p>Approved, completed work earns a field badge and a project certificate. Your experience grows with what you do.</p><span class="step-note">Work that becomes your story</span></article></div></section>
        <section class="projects-section" id="projects"><div class="wrap"><div class="section-heading"><div><p class="eyebrow">A GLIMPSE OF WHAT’S POSSIBLE</p><h2>Small starts.<br><em>Meaningful work.</em></h2></div><p>Explore illustrative project briefs. Your next step could look a little like this.</p></div><div class="project-filter" role="group" aria-label="Filter sample projects"><button class="active" data-field="All" aria-pressed="true">All fields</button><button data-field="Design" aria-pressed="false">Design</button><button data-field="Data analysis" aria-pressed="false">Data analysis</button><button data-field="Cybersecurity" aria-pressed="false">Cybersecurity</button><button data-field="Management" aria-pressed="false">Management</button></div><div class="project-grid" id="sample-projects"></div><div class="project-bottom"><span>Sample briefs for this private design preview. Amounts are illustrative.</span><a class="light-link" href="#/join/intern">Find a place to begin <span>↗</span></a></div></div></section>
        <section class="company-section section-space wrap" id="companies"><div class="company-art"><div class="brief-sheet"><div class="brief-top"><span class="brand-mark">↗</span><span>A GOOD IDEA STARTS HERE</span><span>01 / 03</span></div><h3>What are we<br>bringing to life?</h3><div class="fake-input"><small>PROJECT TITLE</small><span>A fresh identity for a greener future</span></div><div class="brief-pills"><span>✳ Design</span><span>◷ Clear milestones</span></div><div class="brief-divider"></div><div class="coordinator"><span class="coordinator-icon">↗</span><div><strong>One point of contact.</strong><small>We keep everything moving.</small></div><b>✓</b></div></div><div class="company-caption">YOUR VISION, WITH A CLEAR WAY FORWARD.</div></div><div class="company-copy"><p class="eyebrow">FOR COMPANIES WITH SOMETHING IN MIND</p><h2>Your next project.<br><em>In good hands.</em></h2><p>Bring the brief. We’ll coordinate the work, keep you updated, and bring the deliverables back to you for review.</p><ul class="check-list"><li>One platform. One point of contact.</li><li>Clear scope, deadlines and progress.</li><li>Review the work. Share feedback. Move forward.</li></ul><a class="button button-primary" href="#/join/company">Let’s shape your project <span>↗</span></a></div></section>
        <section class="faq-section section-space wrap"><div><p class="eyebrow">A LITTLE CLARITY</p><h2>Good questions.<br><em>Straight answers.</em></h2><p>Starting something new should feel simple.</p></div><div class="faq-list"><details><summary>Do I need previous experience?<span>+</span></summary><p>No. Choose the fields you’re interested in. Your experience on inJectyou grows through the projects you complete, rather than a résumé you bring with you.</p></details><details><summary>Who will I work with?<span>+</span></summary><p>Your inJectyou coordinator shares the project brief, passes on feedback and reviews submissions. Companies and interns communicate through the platform, not directly with each other.</p></details><details><summary>How do project payments work?<span>+</span></summary><p>Companies pay the platform upfront. Interns see their own agreed fee and are paid after approved, completed work. Project approval and payout are tracked separately. This design preview does not process payments.</p></details><details><summary>What do I get when I finish?<span>+</span></summary><p>Once your work is approved and the project is complete, the platform can issue a field badge and project certificate. Certificates include project information and a verification identifier.</p></details><details><summary>Is this website open for applications?<span>+</span></summary><p>This is a private, interactive design prototype. The projects, accounts and payment amounts are sample content. Live applications and account access will be connected before launch.</p></details></div></section>
